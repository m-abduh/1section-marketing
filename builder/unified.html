<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1350">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
:root{--paper:#f7f5f0;--ink:#1a1a1a;--muted:#7a776e;--badge:#1a1a1a;--rule:#d8d4c9;--code-bg:#efede6}
html,body{font-family:'Satoshi',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
#root{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
#paper{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;z-index:0}
#bg-tint{position:absolute;inset:0;z-index:0;pointer-events:none}
.clip{position:absolute;inset:0;display:flex;flex-direction:column;padding:85px 85px 78px;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-shrink:0}
.category-badge{background:var(--badge);color:#fff;font-size:20px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:8px 18px;border-radius:999px}
.account{display:flex;align-items:baseline;gap:4px;font-size:32px;color:var(--ink)}
.account .at{font-weight:500;color:var(--muted)}
.account .handle{font-weight:800}
.account .domain{color:var(--muted);font-weight:500}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.mdwrap{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.md{width:100%;transform-origin:center center}
/* --- headings: one clear scale, h5/h6 act as kickers --- */
.md h1{font-size:66px;font-weight:900;letter-spacing:-1.6px;line-height:1.02;margin:0 0 22px}
.md h2{font-size:53px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:0 0 22px}
.md h3{font-size:44px;font-weight:800;letter-spacing:-.6px;line-height:1.16;margin:30px 0 14px}
.md h4{font-size:38px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin:26px 0 12px}
.md h5{font-size:33px;font-weight:800;letter-spacing:.2px;line-height:1.25;margin:24px 0 10px}
.md h6{font-size:28px;font-weight:700;letter-spacing:2px;line-height:1.3;margin:22px 0 10px;text-transform:uppercase;color:var(--muted)}
.md > :first-child{margin-top:0}

/* --- separators --- */
.md hr{border:none;border-top:3px solid var(--rule);margin:26px 0 26px}

/* --- paragraphs + inline --- */
.md p{margin:0 0 20px;font-size:40px;font-weight:600;line-height:1.32;letter-spacing:-.3px}
.md p:last-child{margin-bottom:0}
.md strong{font-weight:900}
.md em{font-style:italic}
.md del{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;-webkit-text-decoration-color:var(--muted)}
.md u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.md mark{background:#ffe6a0;color:var(--ink);padding:0 .16em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.md small{font-size:.76em;color:var(--muted);font-weight:500}
.md sub,.md sup{font-size:.62em;line-height:0}
.md kbd{font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:.78em;font-weight:600;background:#fff;border:2px solid var(--rule);border-bottom-width:5px;border-radius:9px;padding:.06em .42em;white-space:nowrap}
.md a{color:inherit;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}

/* --- quotes (supports nesting) --- */
.md blockquote{margin:0 0 20px;padding:22px 28px;background:rgba(0,0,0,.055);border-radius:18px;font-size:37px;font-weight:600;line-height:1.32;letter-spacing:-.3px}
.md blockquote p{margin:0;font-size:inherit}
.md blockquote p+p{margin-top:14px}
.md blockquote p:last-child{margin-bottom:0}
.md blockquote blockquote{margin:16px 0 0;padding:0 0 0 22px;background:none;border-left:6px solid var(--rule);border-radius:0;font-size:33px;color:var(--muted)}

/* --- arrow chains: centered card, vertical ↓ or horizontal → --- */
.md .chain{margin:0 0 24px;padding:26px 28px;border:3px solid var(--rule);border-radius:22px;text-align:center}
.md .chain-step{display:inline-block}
.md .chain-v .chain-step{font-size:37px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.md .chain-v .chain-arrow{font-size:30px;font-weight:700;line-height:1;color:var(--muted);margin:10px 0}
.md .chain-h .chain-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;font-size:35px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.md .chain-h .chain-row + .chain-row{margin-top:14px}
.md .chain-h .chain-arrow{font-size:30px;font-weight:700;line-height:1;color:var(--muted)}

/* --- lists: nested + ordered + task --- */
.md ul,.md ol{margin:0 0 20px;padding-left:44px}
.md ul{list-style:disc}
.md ul ul{list-style:circle}
.md ul ul ul{list-style:square}
.md ol{list-style:decimal}
.md ol ol{list-style:lower-alpha}
.md li{margin:0 0 16px;font-size:37px;font-weight:600;line-height:1.3;letter-spacing:-.3px}
.md li:last-child{margin-bottom:0}
.md li::marker{color:var(--muted)}
.md li > ul,.md li > ol{margin:10px 0 0;padding-left:34px}
.md li > ul li,.md li > ol li{font-size:33px;margin-bottom:10px}
.md li > ul li:last-child,.md li > ol li:last-child{margin-bottom:0}
.md ul.tasks{list-style:none;padding-left:0}
.md ul.tasks > li{position:relative;padding-left:56px}
.md ul.tasks ul{list-style:disc}
.md .task{position:absolute;left:0;top:4px;width:34px;height:34px;border:3px solid var(--rule);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1}
.md .task-done{border-color:var(--ink);background:var(--ink);color:#fff}

/* --- tables: alignment-aware + zebra --- */
.md table{border-collapse:collapse;width:100%;margin:0 0 20px}
.md th,.md td{border:2px solid var(--rule);padding:14px 18px;font-size:34px;line-height:1.25;text-align:left}
.md th{font-weight:900;background:rgba(0,0,0,.05)}
.md td{font-weight:600}
.md th[align="center"],.md td[align="center"]{text-align:center}
.md th[align="right"],.md td[align="right"]{text-align:right}
.md tbody tr:nth-child(even) td{background:rgba(0,0,0,.022)}
.md pre{--code-text:#f0efe9;background:#1b1b1f;color:var(--code-text);border:1px solid #2a2a30;border-radius:18px;padding:22px 26px;margin:0 0 20px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.14);font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:36px;font-weight:500;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word;text-align:left}
.md pre code{font-family:inherit;font-size:36px;font-weight:500;background:none;color:inherit;padding:0}
.md code{font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:34px;background:#1b1b1f;color:#f0efe9;padding:3px 11px;border-radius:8px}
.footer{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:auto;padding-top:16px;flex-shrink:0}
.footer .flink{display:flex;align-items:center;font-size:32px;letter-spacing:.3px}
.footer .flink-ico{width:30px;height:30px;margin-right:12px;flex:none;color:var(--muted)}
.footer .flink-head{font-weight:800;color:var(--ink)}
.footer .flink-rest{font-weight:500;color:var(--muted)}
</style>
</head>
<body>
<div id="root" data-composition-id="unified" data-start="0" data-width="1080" data-height="1350" data-duration="15">
<div id="bg-tint" style="background:{{bg_fill}}"></div>
<svg id="paper" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350">
  <defs>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1080" height="1350" filter="url(#n)" opacity="0.6"/>
</svg>
<section class="clip" id="unified-scene" data-start="0" data-duration="15" data-track-index="1">
  <div class="topbar">
    <span class="category-badge">{{category}}</span>
    <div class="account"><span class="at">@</span><span class="handle">{{account}}</span></div>
  </div>
  <div class="body">
    <div class="mdwrap">
      <div class="md">{{content}}</div>
    </div>
  </div>
  <div class="footer">
    <div class="flink">
      <svg class="flink-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span class="flink-head">{{account_link_head}}</span><span class="flink-rest">{{account_link_tail}}</span>
    </div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
window.__timelines['unified']=gsap.timeline({paused:true})
</script>
</body>
</html>
