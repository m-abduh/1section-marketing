<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1350">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
:root{
  --paper:#f7f5f0;
  --ink:#1a1a1a;
  --muted:#7a776e;
  --rule:#d8d4c9;
  --code-bg:#efede6;
  --accent:#e05a33;
  --accent-ink:#a83a1c;
  --accent-soft:rgba(224,90,51,.10);
}
html,body{font-family:'Satoshi',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
#root{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper)}
#bg-tint{position:absolute;inset:0;z-index:0;pointer-events:none}
#glow{position:absolute;inset:-40px;z-index:0;pointer-events:none;
  background:
    radial-gradient(48% 34% at 100% 0%,rgba(224,90,51,.15) 0%,transparent 68%),
    radial-gradient(42% 30% at 0% 100%,rgba(26,26,26,.06) 0%,transparent 72%);
  animation:drift 9s ease-in-out infinite}
#paper{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;z-index:0}
.clip{position:absolute;inset:0;display:flex;flex-direction:column;padding:76px 82px 70px;z-index:1}

/* ---------- header ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;padding-bottom:16px;flex-shrink:0;border-bottom:1px solid var(--rule);position:relative;animation:riseIn .65s cubic-bezier(.2,.8,.2,1) both}
.topbar::after{content:"";position:absolute;left:0;bottom:-1px;width:72px;height:3px;border-radius:99px;background:var(--accent)}
.brand{display:flex;align-items:center;min-width:0}
.brand-word{font-size:30px;font-weight:900;letter-spacing:-.9px;line-height:1;color:var(--ink);white-space:nowrap}
.brand-dot{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:16px;min-width:0}
.category-badge{display:inline-flex;align-items:center;gap:9px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid rgba(224,90,51,.24);font-size:26px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px;border-radius:999px;white-space:nowrap}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(224,90,51,.12);animation:pulse 3.2s ease-in-out infinite}
.account{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;line-height:1;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.account .handle{font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account .at{color:var(--muted);font-weight:600;margin-right:1px}

/* ---------- body / content card ---------- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding:14px 0}
.mdwrap{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.content-card{position:relative;width:100%;max-width:100%;min-height:500px;display:flex;flex-direction:column;justify-content:center;padding:36px 42px 40px;border-radius:34px;background:linear-gradient(180deg,rgba(255,253,248,.94),rgba(255,252,246,.80));border:1px solid rgba(26,26,26,.08);box-shadow:0 30px 70px rgba(26,26,26,.10),0 2px 0 rgba(255,255,255,.75) inset;transform-origin:center center;animation:fadeIn .9s .10s both}
.content-card::before{content:"";position:absolute;left:0;top:44px;bottom:44px;width:5px;border-radius:0 99px 99px 0;background:linear-gradient(180deg,var(--accent) 0%,rgba(224,90,51,0) 100%)}
.content-meta{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:26px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);line-height:1}
.content-meta-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.md{width:100%;transform-origin:center center}

/* --- headings: one clear scale, h5/h6 act as kickers --- */
.md h1{font-size:64px;font-weight:900;letter-spacing:-1.6px;line-height:1.02;margin:0 0 22px}
.md h2{font-size:50px;font-weight:900;letter-spacing:-1.2px;line-height:1.12;margin:0 0 20px}
.md h2:first-child{position:relative;padding-bottom:18px;margin-bottom:26px}
.md h2:first-child::after{content:"";position:absolute;left:0;bottom:0;width:58px;height:4px;border-radius:99px;background:var(--accent)}
.md h3{font-size:42px;font-weight:800;letter-spacing:-.6px;line-height:1.16;margin:28px 0 13px}
.md h4{font-size:36px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin:24px 0 11px}
.md h5{font-size:31px;font-weight:800;letter-spacing:.2px;line-height:1.25;margin:22px 0 9px}
.md h6{font-size:26px;font-weight:700;letter-spacing:2px;line-height:1.3;margin:20px 0 9px;text-transform:uppercase;color:var(--muted)}
.md > :first-child{margin-top:0}

/* --- separators --- */
.md hr{border:none;border-top:2px solid var(--rule);margin:24px 0}

/* --- paragraphs + inline --- */
.md p{margin:0 0 18px;font-size:38px;font-weight:600;line-height:1.36;letter-spacing:-.3px}
.md p:last-child{margin-bottom:0}
.md strong{font-weight:900}
.md em{font-style:italic}
.md del{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;-webkit-text-decoration-color:var(--muted)}
.md u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.md mark{background:#ffe3a3;color:var(--ink);padding:0 .16em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.md small{font-size:max(26px,.76em);color:var(--muted);font-weight:500}
.md sub,.md sup{font-size:max(26px,.62em);line-height:0}
.md kbd{font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:max(26px,.78em);font-weight:600;background:#fff;border:2px solid var(--rule);border-bottom-width:5px;border-radius:9px;padding:.06em .42em;white-space:nowrap}
.md a{color:inherit;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}

/* --- quotes --- */
.md blockquote{margin:0 0 18px;padding:20px 24px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:0 18px 18px 0;font-size:35px;font-weight:600;line-height:1.34;letter-spacing:-.3px}
.md blockquote p{margin:0;font-size:inherit}
.md blockquote p+p{margin-top:14px}
.md blockquote p:last-child{margin-bottom:0}
.md blockquote blockquote{margin:16px 0 0;padding:0 0 0 22px;background:none;border-left:4px solid var(--rule);border-radius:0;font-size:31px;color:var(--muted)}

/* --- arrow chains --- */
.md .chain{margin:0 0 22px;padding:24px 26px;border:2px solid var(--rule);border-radius:22px;background:rgba(255,255,255,.55);text-align:center}
.md .chain-step{display:inline-block}
.md .chain-v .chain-step{font-size:35px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.md .chain-v .chain-arrow{font-size:28px;font-weight:700;line-height:1;color:var(--accent);margin:9px 0}
.md .chain-h .chain-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;font-size:33px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.md .chain-h .chain-row + .chain-row{margin-top:14px}
.md .chain-h .chain-arrow{font-size:28px;font-weight:700;line-height:1;color:var(--accent)}

/* --- lists --- */
.md ul,.md ol{margin:0 0 18px;padding-left:42px}
.md ul{list-style:disc}
.md ul ul{list-style:circle}
.md ul ul ul{list-style:square}
.md ol{list-style:decimal}
.md ol ol{list-style:lower-alpha}
.md li{margin:0 0 14px;font-size:35px;font-weight:600;line-height:1.32;letter-spacing:-.3px}
.md li:last-child{margin-bottom:0}
.md li::marker{color:var(--accent)}
.md li > ul,.md li > ol{margin:10px 0 0;padding-left:32px}
.md li > ul li,.md li > ol li{font-size:31px;margin-bottom:9px}
.md li > ul li:last-child,.md li > ol li:last-child{margin-bottom:0}
.md ul.tasks{list-style:none;padding-left:0}
.md ul.tasks > li{position:relative;padding-left:54px}
.md ul.tasks ul{list-style:disc}
.md .task{position:absolute;left:0;top:3px;width:34px;height:34px;border:3px solid var(--rule);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;line-height:1}
.md .task-done{border-color:var(--accent);background:var(--accent);color:#fff}

/* --- tables --- */
.md table{border-collapse:separate;border-spacing:0;width:100%;margin:0 0 18px;border:2px solid var(--rule);border-radius:16px;overflow:hidden}
.md th,.md td{border-bottom:2px solid var(--rule);padding:13px 16px;font-size:32px;line-height:1.25;text-align:left}
.md th{font-weight:900;background:var(--ink);color:var(--paper);border-bottom-color:var(--ink)}
.md td{font-weight:600}
.md th[align="center"],.md td[align="center"]{text-align:center}
.md th[align="right"],.md td[align="right"]{text-align:right}
.md tr:last-child td{border-bottom:none}
.md tbody tr:nth-child(even) td{background:rgba(0,0,0,.025)}

/* --- code --- */
.md pre{--code-text:#f0efe9;background:#1b1b1f;color:var(--code-text);border:1px solid #2a2a30;border-left:4px solid var(--accent);border-radius:16px;padding:20px 24px;margin:0 0 18px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.14);font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:34px;font-weight:500;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word;text-align:left}
.md pre code{font-family:inherit;font-size:34px;font-weight:500;background:none;color:inherit;padding:0}
.md code{font-family:'ui-monospace','SFMono-Regular','Menlo','Consolas',monospace;font-size:32px;background:#1b1b1f;color:#f0efe9;padding:3px 10px;border-radius:8px}

/* ---------- footer CTA ---------- */
.footer{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:auto;padding-top:18px;flex-shrink:0;animation:riseIn .7s .35s both}
.footer-cta{position:relative;display:inline-flex;align-items:center;gap:16px;max-width:100%;background:linear-gradient(135deg,#1d1d1f 0%,#0c0c0e 100%);color:var(--paper);border-radius:24px;padding:16px 20px 16px 16px;box-shadow:0 18px 38px rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.12) inset;overflow:hidden}
.footer-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 50%,transparent 70%);transform:translateX(-120%);animation:shimmer 5s ease-in-out infinite;pointer-events:none}
.footer-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.footer-icon svg{width:22px;height:22px}
.footer-copy{display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;z-index:1;max-width:620px}
.footer-kicker{font-size:26px;font-weight:800;letter-spacing:-.2px;text-transform:none;color:#fff;line-height:1.18;white-space:normal;text-wrap:balance}
.footer-link{font-size:26px;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#fff;white-space:nowrap}
.footer-head{font-weight:900}
.footer-tail{color:rgba(255,255,255,.55);font-weight:500}
.footer-arrow{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;z-index:1;box-shadow:0 4px 12px rgba(224,90,51,.35)}
.footer-arrow svg{width:18px;height:18px}

/* ---------- CTA end card (15-20s) ---------- */
.cta-clip{
  z-index:2;
  background:#08090c;
  color:#fff;
  padding:85px;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.cta-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 70% at 50% 8%,#16181f 0%,transparent 62%),
    radial-gradient(120% 90% at 50% 115%,#0d0f14 0%,transparent 70%),
    linear-gradient(180deg,#0b0c10 0%,#07080a 100%)}
.cta-grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:84px 84px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 70%);
  mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 70%)}
.cta-clip > *{position:relative;z-index:1}
.cta-clip > .cta-bg,.cta-clip > .cta-grid{position:absolute;z-index:0}
.cta-inner{display:flex;flex-direction:column;align-items:center;width:100%}
.cta-logo{display:flex;flex-direction:column;align-items:center;gap:7px}
.cta-word{font-size:46px;font-weight:800;letter-spacing:-.8px;line-height:1;color:#fff}
.cta-dot{color:var(--accent)}
.cta-niche{font-size:26px;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.cta-main{margin-top:48px;display:flex;flex-direction:column;align-items:center;width:100%}
.cta-eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.cta-eyebrow:before,.cta-eyebrow:after{content:"";width:28px;height:1px;background:rgba(224,90,51,.55);display:block}
.cta-conclusion{margin-top:18px;font-size:54px;font-weight:700;line-height:1.22;letter-spacing:-1.1px;color:#fff;max-width:900px;text-align:center;text-wrap:balance}
.cta-foot{margin-top:48px;display:flex;flex-direction:column;align-items:center;width:100%}
.cta-rule{width:120px;height:1px;background:rgba(255,255,255,.18);margin-bottom:28px}
.cta-follow-label{font-size:26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:8px}
.cta-follow{display:flex;align-items:baseline;justify-content:center;gap:2px;font-size:54px;font-weight:900;letter-spacing:-1.3px;line-height:1.05;color:#fff}
.cta-follow .at{color:#fff;font-weight:600}
.cta-link-label{margin-top:34px;font-size:26px;font-weight:600;letter-spacing:0;line-height:1.3;color:rgba(255,255,255,.62);max-width:820px;text-wrap:balance}
.cta-link{margin-top:13px;display:inline-flex;align-items:center;gap:13px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);border-radius:16px;padding:15px 22px;font-size:31px;font-weight:600;box-shadow:0 0 0 1px rgba(224,90,51,.08) inset}
.cta-link .ico{width:27px;height:27px;color:var(--accent);flex:none}
.cta-link .cta-url{display:inline-block;white-space:nowrap;font-weight:700;color:#fff}

/* ---------- motion ---------- */
@keyframes riseIn{from{transform:translateY(14px)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:.9}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.15);opacity:1}}
@keyframes shimmer{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-14px,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root" data-composition-id="unified" data-start="0" data-width="1080" data-height="1350" data-duration="20">
<div id="bg-tint" style="background:{{bg_fill}}"></div>
<div id="glow"></div>
<svg id="paper" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350">
  <defs>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1080" height="1350" filter="url(#n)" opacity="0.6"/>
</svg>
<section class="clip" id="unified-scene" data-start="0" data-duration="15" data-track-index="1">
  <header class="topbar">
    <div class="brand">
      <div class="brand-word">1section<span class="brand-dot">.</span></div>
    </div>
    <div class="topbar-right">
      <span class="category-badge"><span class="badge-dot"></span>{{category}}</span>
      <div class="account">
        <span class="avatar">{{account_initial}}</span>
        <span class="handle"><span class="at">@</span>{{account}}</span>
      </div>
    </div>
  </header>

  <div class="body">
    <div class="mdwrap">
      <div class="content-card">
        <div class="content-meta"><span class="content-meta-dot"></span>The real problem</div>
        <div class="md">{{content}}</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-cta">
      <span class="footer-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </span>
      <span class="footer-copy">
        <span class="footer-kicker">{{cta_action}}</span>
        <span class="footer-link"><span class="footer-head">{{account_link_head}}</span><span class="footer-tail">{{account_link_tail}}</span></span>
      </span>
      <span class="footer-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
      </span>
    </div>
  </footer>
</section>

<section class="clip cta-clip" data-start="15" data-duration="5">
  <div class="cta-bg"></div>
  <div class="cta-grid"></div>
  <div class="cta-inner">
    <div class="cta-logo">
      <div class="cta-word">1section<span class="cta-dot">.</span></div>
      <div class="cta-niche">{{niche}}</div>
    </div>

    <div class="cta-main">
      <div class="cta-eyebrow">The bottom line</div>
      <p class="cta-conclusion">{{conclusion}}</p>
    </div>

    <div class="cta-foot">
      <div class="cta-rule"></div>
      <div class="cta-follow-label">Follow for more</div>
      <div class="cta-follow"><span class="at">@</span><span class="handle">{{account}}</span></div>

      <div class="cta-link-label">{{cta_action}}</div>
      <div class="cta-link">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="cta-url">{{account_link}}</span>
      </div>
    </div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
window.__timelines['unified']=gsap.timeline({paused:true})
</script>
</body>
</html>
