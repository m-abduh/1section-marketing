<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1728">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
:root{
  --bg:{{bg}};
  --fg:{{fg}};
  --ac:{{ac}};
  --muted:{{muted}};
}
html,body{width:1080px;height:1728px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Satoshi',system-ui,sans-serif}
#root{position:relative;width:1080px;height:1728px;overflow:hidden;background:var(--bg)}
#paper{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;pointer-events:none;z-index:0}
#stage{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:96px 92px}

/* single reality card */
.card{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .brand-block{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
  .brand{font-size:52px;font-weight:800;letter-spacing:-1.2px;line-height:1;color:var(--fg)}
  .brand .dot{color:var(--ac)}
  .brand-niche{font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.1;text-align:center}
  .category{font-size:30px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2;padding-top:6px;text-align:right;max-width:46%}
  .body{flex:1;display:flex;align-items:center;justify-content:center;padding:42px 0}
  .quote{width:100%;max-width:900px;font-size:82px;line-height:1.22;font-weight:600;letter-spacing:-1.8px;text-wrap:balance;color:var(--fg)}
  .quote .ac{color:var(--ac)}
  .bottom{display:flex;justify-content:center;align-items:flex-end;padding-top:24px}
  .conclusion{width:100%;max-width:860px;font-size:32px;font-weight:500;line-height:1.45;letter-spacing:-.2px;color:var(--muted);text-align:center;text-wrap:balance}

/* ---- sales CTA (full 1080x1728) ---- */
.sales{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 84px;z-index:2;background:var(--bg);color:var(--fg)}
.sales-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:34px}
.sales-logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.sales-word{font-size:56px;font-weight:900;letter-spacing:-1.2px;line-height:1;color:var(--fg)}
.sales-dot{color:var(--ac)}
.sales-niche{font-size:26px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.sales-headline{margin:0;font-size:58px;font-weight:800;line-height:1.12;letter-spacing:-1.4px;color:var(--fg);max-width:920px;text-wrap:balance}
.sales-sub{margin:0;font-size:38px;font-weight:500;line-height:1.3;letter-spacing:-.5px;color:var(--ac);max-width:900px;text-wrap:balance}
.sales-book-row{display:flex;align-items:center;justify-content:center;gap:44px;width:100%;max-width:940px}
.sales-book{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sales-book-img{width:420px;height:588px;object-fit:cover;border-radius:18px;box-shadow:0 22px 52px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.08);background:rgba(255,255,255,.06)}
.sales-book-fallback{width:420px;height:588px;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 100%);box-shadow:0 22px 52px rgba(0,0,0,.2);display:flex;align-items:flex-end;padding:28px}
.sales-book-name{font-size:34px;font-weight:800;line-height:1.2;letter-spacing:-.5px;color:var(--fg);text-align:left;text-wrap:balance}
.sales-benefits{display:flex;flex-direction:column;gap:18px;flex:1;min-width:0;text-align:left}
.sales-benefits-title{font-size:28px;font-weight:800;line-height:1.2;color:var(--ac)}
.sales-price-block{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px}
.sales-price{font-size:52px;font-weight:900;line-height:1;letter-spacing:-1.2px;color:var(--fg)}
.sales-compare-price{font-size:32px;font-weight:700;line-height:1.1;color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px}
.sales-discount{display:inline-flex;align-items:center;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:24px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.sales-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.sales-points li{display:flex;align-items:flex-start;gap:14px;font-size:34px;font-weight:600;line-height:1.35;letter-spacing:-.3px;color:var(--fg);padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.sales-points li::before{content:"";flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--ac);margin-top:18px}
.sales-link-block{width:100%;max-width:920px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.sales-link-label,.sales-url{font-size:36px;font-weight:500;line-height:1.2;letter-spacing:-.4px}
.sales-link-label{color:var(--ac)}
.sales-link-sep{font-size:34px;font-weight:300;color:var(--muted)}
.sales-url-row{display:inline-flex;align-items:center;gap:10px}
.sales-url{color:var(--fg);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:8px;text-decoration-color:var(--ac)}
.sales-arrow{font-size:32px;color:var(--ac);line-height:1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root" data-composition-id="unified" data-start="0" data-width="1080" data-height="1728" data-duration="20">
  <svg id="paper" xmlns="http://www.w3.org/2000/svg" width="1080" height="1728" aria-hidden="true">
    <defs>
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    <rect width="1080" height="1728" filter="url(#n)" opacity="0.45"/>
  </svg>
  <div id="stage"></div>
</div>

<script>
window.__DATA__ = {{payload_json}};
(function(){
  var D = window.__DATA__ || {};
  var stage = document.getElementById('stage');
  var rootStyle = document.documentElement.style;
  var theme = D.theme || {};
  rootStyle.setProperty('--bg', theme.bg || '#12141A');
  rootStyle.setProperty('--fg', theme.fg || '#F4F1EA');
  rootStyle.setProperty('--ac', theme.ac || '#F2B84B');
  rootStyle.setProperty('--muted', theme.muted || 'rgba(244,241,234,.68)');

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function hl(s){
    var t = String(s==null?'':s);
    return esc(t).replace(/\[\[(.*?)\]\]/g,function(_,m){ return '<span class="ac">'+esc(m)+'</span>'; });
  }

  function renderSales(D){
    var img = D.product_image ? '<img class="sales-book-img" src="'+esc(D.product_image)+'" alt="'+esc(D.product_name||'')+'"/>' : '<div class="sales-book-fallback"><div class="sales-book-name">'+esc(D.product_name||D.niche||'1section')+'</div></div>';
    var pts = (D.product_points||[]).slice(0,3).map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('');
    var price = D.price_block_html || '';
    var headline = esc(D.sales_headline || D.conclusion || 'Get the guide');
    var sub = esc(D.sales_sub || D.cta_action || '');
    var niche = esc((D.niche||'1section').toUpperCase());
    stage.innerHTML = '<div class="sales">'
      + '<div class="sales-inner">'
      +   '<div class="sales-logo"><div class="sales-word">1section<span class="sales-dot">.</span></div><div class="sales-niche">'+niche+'</div></div>'
      +   '<div class="sales-headline">'+headline+'</div>'
      +   (sub?'<div class="sales-sub">'+sub+'</div>':'')
      +   '<div class="sales-book-row">'
      +     '<div class="sales-book">'+img+'</div>'
      +     '<div class="sales-benefits">'
      +       '<div class="sales-benefits-title">'+esc(D.benefits_title||'Why this E-book?')+'</div>'
      +       (price?'<div class="sales-price-block">'+price+'</div>':'')
      +       '<ul class="sales-points">'+pts+'</ul>'
      +     '</div>'
      +   '</div>'
      +   '<div class="sales-link-block"><span class="sales-link-label">'+esc(D.link_label||'Get it here')+'</span><span class="sales-link-sep">|</span><span class="sales-url-row"><span class="sales-url">'+esc(D.account_link||'')+'</span><span class="sales-arrow">↗</span></span></div>'
      + '</div></div>';
  }

  function renderContent(D){
    var niche = esc((D.niche||'1section').toUpperCase());
    var category = esc((D.category||niche).toUpperCase());
    var main = hl(D.main || D.content || D.hook || '');
    var conclusion = esc(D.conclusion || D.summary || D.footer || '');
    stage.innerHTML = '<div class="card">'
      + '<div class="top">'
      +   '<div class="brand-block"><div class="brand">1section<span class="dot">.</span></div><div class="brand-niche">'+niche+'</div></div>'
      +   '<div class="category">'+category+'</div>'
      + '</div>'
      + '<div class="body"><div class="quote">'+main+'</div></div>'
      + '<div class="bottom">'+(conclusion?'<div class="conclusion">'+conclusion+'</div>':'')+'</div>'
      + '</div>';
  }

  if (D.mode === 'sales') renderSales(D); else renderContent(D);
})();
</script>
</body>
</html>
